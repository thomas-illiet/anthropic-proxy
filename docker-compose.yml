services:
  anthropic-proxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
    image: anthropic-proxy:local
    container_name: anthropic-proxy
    env_file:
      - path: .env
        required: false
    ports:
      - "8787:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
